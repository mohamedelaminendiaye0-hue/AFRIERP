server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # L'API Spring Boot est servie sous la meme origine : pas de CORS a gerer.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application monopage : toute route inconnue renvoie index.html.
    # index.html n'est jamais mis en cache : après une mise à jour, le navigateur
    # charge aussitôt la nouvelle version (et ses fichiers aux noms hachés).
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Fichiers produits par Angular (nom haché, ex. main-AB12CD34.js) : cache long.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Autres fichiers statiques (polices, icônes) : cache court, revalidé.
    location ~* \.(js|css|png|ico|svg|woff2?)$ {
        expires 1d;
        try_files $uri =404;
    }
}
