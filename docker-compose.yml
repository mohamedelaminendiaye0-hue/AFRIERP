# Plateforme Notarius : PostgreSQL + API Spring Boot + frontend Angular (nginx).
#   docker compose up --build
#   -> application : http://localhost:4200   API : http://localhost:8080/api
# Nom de projet fixe : quel que soit le dossier du clone, une mise à jour remplace
# les mêmes conteneurs et images au lieu d'en créer de nouveaux à côté.
name: notarius

services:
  postgres:
    image: postgres:16-alpine
    container_name: notarius-postgres
    environment:
      POSTGRES_DB: notarius
      POSTGRES_USER: notarius
      POSTGRES_PASSWORD: ${DB_PASSWORD:-notarius}
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notarius -d notarius"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: notarius-backend:latest
    container_name: notarius-backend
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/notarius
      DB_USER: notarius
      DB_PASSWORD: ${DB_PASSWORD:-notarius}
      # Fuseau de l'etude : les delais et dates d'audit sont calcules a l'heure de Dakar.
      TZ: Africa/Dakar
      NOTARIUS_DONNEES_DEMO: "true"
      # Clé de signature des jetons de session : à remplacer (32 caractères minimum).
      JWT_SECRET: ${JWT_SECRET:-notarius-cle-docker-a-remplacer-en-production}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    image: notarius-frontend:latest
    container_name: notarius-frontend
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  donnees-postgres:
